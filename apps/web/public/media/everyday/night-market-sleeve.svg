  <title id="title">摊灯熄灭以前：原创平面封套</title>
  <desc id="desc">深蓝底色上是暖黄色夜市棚灯的几何图形，标明十八分钟、阿娴授权发行。此图是本作原创封套，不是超梦录制画面。</desc>
